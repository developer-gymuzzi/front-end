name: CI & Deploy to Northflank

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test || echo "No tests found"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Northflank
        run: |
          curl -X POST "https://api.northflank.com/v1/projects/gymuizz/services/gymuizz/builds" \
          -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"branch":"main"}'
